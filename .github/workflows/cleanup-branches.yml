name: Cleanup — Stale merged branches

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted without deleting anything
        type: boolean
        required: false
        default: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Selection is by PULL REQUEST STATE, not by `git branch --merged`.
      #
      # This repository squash-merges into develop. A squash merge creates a new
      # commit, so no PR branch is ever an ancestor of develop or main, and
      # `git branch -r --merged origin/main` -- what this step used to run -- is
      # empty on every run. Worse, it failed rather than reporting that: the
      # pipeline ended in `grep -v`, which exits 1 on empty input, inside `$( )`
      # under `bash -e`, so the step died before reaching the `exit 0` written for
      # the empty case. It failed every Monday from at least 2026-08-24 and never
      # deleted a branch.
      #
      # A branch is deleted only when ALL of these hold:
      #   - a PR from it was MERGED more than 7 days ago;
      #   - its current head is EXACTLY that PR's head -- a branch that received
      #     commits after its PR merged holds work develop does not have, and is
      #     kept (this has happened here: commits pushed onto a branch whose PR had
      #     already merged, recoverable only because the branch still existed);
      #   - the PR was a same-repository PR into a long-lived branch;
      #   - the branch has no open PR;
      #   - it is not a long-lived branch.
      #
      # Dry run (deletes nothing, prints WOULD/keep lines and a summary notice):
      #   gh workflow run cleanup-branches.yml --ref <branch> -f dry_run=true
      #
      # The script is run through `bash`, not executed directly: it was committed
      # as mode 100644 from Windows (core.fileMode=false), and every run from
      # 2026-09-21 to 2026-10-12 died with exit 126 "Permission denied" before
      # doing anything.
      - name: Delete stale merged branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: bash .github/scripts/cleanup-merged-branches.sh
